<!DOCTYPE html>
<html>
<body>

<h2>Student Marks</h2>
<p id="result"></p>

<script>
    let m1 = 80;
    let m2 = 75;
    let m3 = 90;

   
    let calculate = (a, b, c) => {
        let total = a + b + c;
        let average = total / 3;

        return `Total Marks: ${total}<br>
                Average Marks: ${average.toFixed(2)}`;
    };

   
    document.getElementById("result").innerHTML =
        calculate(m1, m2, m3);
</script>

</body>
</html>
