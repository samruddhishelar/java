<!DOCTYPE html>
<html>
<head>
    <title>Image Gallery</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
            padding: 20px;
            background-color: lightgray;
        }

        h1 {
            text-align: center;
        }

        
        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .gallery img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 10px;
            transition: transform 0.3s;
        }

        
        .gallery img:hover {
            transform: scale(1.05);
            opacity: 0.8;
        }

        
        @media (max-width: 600px) {
            .gallery {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 400px) {
            .gallery {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <h1>My Image Gallery</h1>

    <div class="gallery">
        <img src="https://picsum.photos/id/10/400/300" alt="Forest">
        <img src="https://picsum.photos/id/20/400/300" alt="Nature">
        <img src="https://picsum.photos/id/30/400/300" alt="Mountains">
        <img src="https://picsum.photos/id/40/400/300" alt="Waterfall">
        <img src="https://picsum.photos/id/50/400/300" alt="Flowers">
        <img src="https://picsum.photos/id/60/400/300" alt="Landscape">
    </div>

</body>
</html>
