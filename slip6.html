<!DOCTYPE html>
<html>
<head>
    <title>Hover Effect</title>
    <style>
        button {
            background-color: blue;
            color: white;
            padding: 10px;
        }

        button:hover {
            background-color: red;
            cursor: pointer;
        }

        a {
            color: blue;
        }

        a:hover {
            color: red;
            font-size: 25px;
        }
    </style>
</head>
<body>
    <button>Click Me</button>
    <br><br>
    <a href="https://www.google.com">Visit Google</a>
</body>
</html>
