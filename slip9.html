<!DOCTYPE html>
<html>
<body>
    <h2>Arithmetic Operations</h2>

    <script>
        let a = 10, b = 5;

        let add = (a, b) => a + b;
        let sub = (a, b) => a - b;
        let mul = (a, b) => a * b;
        let div = (a, b) => a / b;

        document.write("Addition = " + add(a, b) + "<br>");
        document.write("Subtraction = " + sub(a, b) + "<br>");
        document.write("Multiplication = " + mul(a, b) + "<br>");
        document.write("Division = " + div(a, b));
    </script>
</body>
</html>
